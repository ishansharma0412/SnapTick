# Builds the face recognition service image and publishes it to GitHub Container Registry
# (ghcr.io/<owner>/snaptick-face). Azure Container Apps (or any Docker host) pulls it from there.
name: Face service image

on:
  push:
    branches: [main]
    paths:
      - "Backend/deepface_service/**"
      - ".github/workflows/face-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/snaptick-face" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: Backend/deepface_service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
