# Render Blueprint: SnapTick API (free web service)
# The client is deployed on Vercel and the face service on Hugging Face Spaces;
# see DEPLOYMENT.md. Free instances have no persistent disk, so student photos
# are stored in MongoDB and only short-lived scan images use the local disk.
services:
  - type: web
    name: snaptick-api
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: MONGO_URI
        sync: false # MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false # e.g. https://snaptick-api.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://snaptick.vercel.app
      - key: DEEPFACE_URL
        sync: false # e.g. https://<user>-snaptick-face.hf.space
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false # e.g. abes.ac.in (leave empty to allow any email)
